[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-firewall"
version = "0.1.0"
description = "Offline-first PII Detection & Redaction Engine"
readme = "README.md"
authors = [{ name = "Suraj Songara" }]
keywords = [
    "pii",
    "redaction",
    "privacy",
    "pdf",
    "ocr",
    "aadhaar",
    "pan",
    "gstin",
    "data-protection",
    "anonymization",
]
requires-python = ">=3.12"
# The engine no longer links any copyleft component: PDFium and pypdfium2 are
# BSD-3-Clause/Apache-2.0 and Pillow is MIT-CMU, so this licence is now a free
# choice rather than an obligation inherited from PyMuPDF. See packaging/README.md.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: General",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "pypdfium2>=5",
    "pillow>=10",
    "typer>=0.12",
    "pyyaml>=6",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.8",
]
ocr-lite = [
    # PaddleOCR models via ONNX Runtime: pure-wheel install, models bundled,
    # no system binary. The recommended OCR backend for packaged builds.
    "rapidocr-onnxruntime>=1.3",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    # Required by Starlette the moment a route declares a file upload
    # (studio.py's /api/upload uses UploadFile). Without it FastAPI raises at
    # app-creation time, so the frozen bundle fails to start.
    "python-multipart>=0.0.9",
]
docx = [
    "python-docx>=1.1",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "python-docx>=1.1",
    # Test-only, never shipped: builds fixture PDFs and acts as an *independent*
    # engine for verifying redaction output. Proving with a different renderer
    # than the one that wrote the file is a far stronger claim than self-checking.
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/SurajSongara/privacy-firewall"
Repository = "https://github.com/SurajSongara/privacy-firewall"
Issues = "https://github.com/SurajSongara/privacy-firewall/issues"
Changelog = "https://github.com/SurajSongara/privacy-firewall/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
privacy-firewall = "privacy_firewall.__main__:entry_point"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["TestFiles", "examples", "benchmarks", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS/JS in the review-UI page string
"src/privacy_firewall/ui/html.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# The review UI (optional `ui` extra) uses FastAPI route decorators that are
# not annotated for mypy; relax the untyped-decorator check for that package.
[[tool.mypy.overrides]]
module = "privacy_firewall.ui.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["privacy_firewall"]
